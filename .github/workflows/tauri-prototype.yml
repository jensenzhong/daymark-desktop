name: Tauri prototype check

on:
  push:
    branches: [codex/tauri-prototype]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check isolated task operations
        run: node --test experiments/tauri-prototype/task-model.test.mjs
      - name: Check Tauri prototype
        run: cargo check --locked --manifest-path experiments/tauri-prototype/src-tauri/Cargo.toml
